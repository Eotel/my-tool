<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>動画・音声の変換</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>動画・音声の変換</h1>

      <section class="panel" aria-labelledby="extract-title">
        <h2 id="extract-title">音声を取り出す</h2>

        <label class="field" for="file">動画または音声のファイル</label>
        <input id="file" type="file">

        <button id="run" type="button" disabled>音声を取り出す</button>

        <p id="status" role="status" aria-live="polite"></p>

        <div id="result" hidden>
          <audio id="player" controls aria-label="取り出した音声"></audio>
          <a id="save" class="button">mp3 を保存</a>
        </div>
      </section>
    </main>

    <footer>
      <a href="licenses.html">ライセンス</a>
    </footer>

    <script src="vendor/ffmpeg/ffmpeg.js"></script>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
