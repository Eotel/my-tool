<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>動画・音声の変換</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>動画・音声の変換</h1>

      <form id="form" class="panel">
        <div class="step">
          <label class="step-title" for="file">動画または音声のファイル</label>
          <input id="file" type="file">
        </div>

        <fieldset id="operations" class="step" hidden>
          <legend class="step-title">やりたいこと</legend>
          <div id="operation-choices" class="choices"></div>
        </fieldset>

        <fieldset id="formats" class="step" hidden>
          <legend class="step-title">変えたあとの形式</legend>
          <div id="format-choices" class="choices"></div>
        </fieldset>

        <button id="run" type="submit" hidden></button>

        <p id="status" role="status" aria-live="polite"></p>

        <div id="result" hidden>
          <div id="preview"></div>
          <a id="save" class="button"></a>
        </div>
      </form>
    </main>

    <footer>
      <a href="licenses.html">ライセンス</a>
    </footer>

    <script src="vendor/ffmpeg/ffmpeg.js"></script>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
